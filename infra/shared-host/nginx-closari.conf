# Closari site on a shared host whose ports 80/443 belong to the system nginx (the Caddy stack in
# infra/docker-compose.yml is for a dedicated VPS). Installed by infra/shared-host/deploy.sh with __DOMAIN__
# and __WEB__ filled in; `certbot --nginx` then adds the TLS listener and the HTTP -> HTTPS redirect to it.
# Cache rules match infra/Caddyfile: hashed /assets/ immutable, /fonts/ and /art/ one day, the shell no-cache.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    server_tokens off;

    root __WEB__;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # add_header in a location replaces the server-level set, so every location repeats the security headers.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    location ~ ^/(fonts|art)/ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri =404;
    }

    # The single-page shell. Client routes such as /terminal/nvda fall back to it.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }
}
