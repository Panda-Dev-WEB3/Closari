name: nightly
on:
  schedule: [{ cron: "0 7 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  invariants:
    runs-on: ubuntu-24.04
    env:
      RPC_4663: ${{ secrets.RPC_4663 != '' && secrets.RPC_4663 || 'https://rpc.mainnet.chain.robinhood.com' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { submodules: recursive }
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with: { bun-version-file: .bun-version }
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with: { version: v1.8.1 }
      - run: bun install --frozen-lockfile
      - run: FOUNDRY_PROFILE=nightly bun run contracts:test
      - run: bun run --cwd packages/core probe && bun run --cwd packages/core scan && git diff --exit-code -- contracts/deployments || echo "::warning::new stock tokens since the pinned scan"
