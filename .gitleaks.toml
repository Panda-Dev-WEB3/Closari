# gitleaks configuration: default rules plus an allowlist for public, non-secret values that the
# generic-api-key rule mistakes for keys.
[extend]
useDefault = true

[allowlist]
description = "Public on-chain addresses and ABI freeze hashes"
regexTarget = "match"
regexes = [
  # EVM addresses (token, feed and factory addresses are public chain data)
  '''0x[0-9a-fA-F]{40}''',
]
paths = [
  # sha256 hashes of frozen interface ABIs
  '''contracts/interfaces\.lock\.json''',
]
